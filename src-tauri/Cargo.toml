[package]
name = "openclaw-gui"
version = "0.1.0"
description = "OpenClaw local onboarding wizard"
authors = ["OpenClaw"]
edition = "2021"

[lib]
name = "openclaw_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
